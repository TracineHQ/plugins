name: Cut release (reusable)

# Reusable workflow that performs the file-edit half of a TracineHQ plugin
# release: bumps version in every indicator the target repo uses
# (pyproject.toml, .claude-plugin/plugin.json, .claude-plugin/marketplace.json,
# uv.lock) and rolls the CHANGELOG `[Unreleased]` section into
# `[X.Y.Z] - <today>`. Opens a PR against the target repo's main branch.
#
# Called from each managed plugin repo's `cut-release.yml`. The merge of the
# resulting PR is operator-driven; tagging and pushing the tag happens locally
# (signed tag), which then fires the target repo's `release.yml`.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver X.Y.Z (no leading v, no suffix)'
        required: true
        type: string
      target_repo:
        description: 'Plugin repo name within TracineHQ org (guard | convo)'
        required: true
        type: string
      dry_run:
        description: 'Print diff and exit without pushing'
        required: false
        type: boolean
        default: false
      client_id:
        description: 'GitHub App client ID for the tracine-plugin-dispatcher App (caller passes vars.PLUGINS_DISPATCH_CLIENT_ID)'
        required: true
        type: string
    secrets:
      app_private_key:
        description: 'Private key (PEM) for the tracine-plugin-dispatcher App (caller passes secrets.PLUGINS_DISPATCH_APP_PRIVATE_KEY)'
        required: true

permissions:
  contents: read

jobs:
  cut:
    name: Cut ${{ inputs.version }} in ${{ inputs.target_repo }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
        shell: bash
        run: |
          set -eu
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version '$INPUT_VERSION' must match X.Y.Z (no prefix, no suffix)"
            exit 1
          fi
          case "$INPUT_TARGET_REPO" in
            guard|convo) ;;
            *)
              echo "ERROR: target_repo '$INPUT_TARGET_REPO' not in whitelist (guard, convo)"
              exit 1
              ;;
          esac
          echo "OK: cutting $INPUT_VERSION in TracineHQ/$INPUT_TARGET_REPO"

      # Push + PR-open as the App so events trigger downstream CI. The
      # default GITHUB_TOKEN would suppress those events per GitHub's
      # anti-recursion rule.
      - name: Mint plugins-dispatcher app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: TracineHQ
          repositories: ${{ inputs.target_repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout ${{ inputs.target_repo }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: TracineHQ/${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Collect merged PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -eu
          # Find the previous release tag in the target repo. If none exists
          # (first release), fall back to the initial commit datetime so we
          # capture every merged PR. Uses full ISO 8601 instead of YYYY-MM-DD
          # so the cut PR for the previous release (which merged the same day
          # as the tag was created) is excluded by the strict-greater filter.
          if last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            tag_ts=$(git log -1 --format=%aI "$last_tag")
            echo "Last tag: $last_tag (merged-since cutoff: $tag_ts)"
          else
            tag_ts=$(git log --format=%aI --reverse | head -1)
            echo "No prior tag; using initial commit datetime $tag_ts"
          fi

          # Fetch merged PRs against main since that datetime. --limit 200 is
          # well above any realistic release cadence; if we ever exceed it,
          # add pagination. Strict-greater (>) excludes the previous cut PR.
          gh pr list \
            --repo "TracineHQ/$INPUT_TARGET_REPO" \
            --state merged \
            --base main \
            --search "merged:>$tag_ts" \
            --limit 200 \
            --json number,title,author \
            > /tmp/merged_prs.json

          cat /tmp/merged_prs.json

      - name: Apply version bumps and roll CHANGELOG
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
          MERGED_PRS_PATH: /tmp/merged_prs.json
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          """Mirror of ~/develop/tracine-ops/bin/cut-release file-edit logic.

          Regex invariants (must match the source-of-truth script exactly):
            pyproject.toml      : exactly 1 top-level version line
            .claude-plugin/plugin.json: exactly 1 top-level version field
            .claude-plugin/marketplace.json: exactly 2 version fields (metadata + plugin entry)
            uv.lock             : exactly 1 [[package]] entry for the project itself
          """
          from __future__ import annotations

          import datetime as dt
          import difflib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["INPUT_VERSION"]
          repo_name = os.environ["INPUT_TARGET_REPO"]
          today = dt.datetime.now(tz=dt.UTC).date().isoformat()
          repo = Path.cwd()
          merged_prs_path = Path(os.environ["MERGED_PRS_PATH"])

          # Skip when synthesizing release notes:
          #   - "Cut X.Y.Z release ..." titles (prior cut PRs from this workflow)
          #   - any author whose JSON entry has is_bot=true
          # The `is_bot` flag from `gh pr list --json author` is authoritative
          # for both GitHub Apps (author.login like "app/dependabot") and bot
          # users (login ending in "[bot]"), replacing the prior hardcoded
          # login list which missed app-style logins.
          def _is_release_pr_title(title: str) -> bool:
              return bool(re.match(r"^Cut \d+\.\d+\.\d+ release\b", title))

          def build_auto_notes() -> str:
              if not merged_prs_path.is_file():
                  fail(f"merged-PRs file not found at {merged_prs_path}")
              data = json.loads(merged_prs_path.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  fail("merged-PRs JSON must be a list")
              lines: list[str] = []
              for item in data:
                  title = (item.get("title") or "").strip()
                  number = item.get("number")
                  author = item.get("author") or {}
                  if not title or number is None:
                      continue
                  if _is_release_pr_title(title):
                      continue
                  if author.get("is_bot"):
                      continue
                  lines.append(f"- {title} (#{number})")
              return "\n".join(lines)

          def fail(msg: str) -> None:
              print(f"ERROR: {msg}", file=sys.stderr)
              sys.exit(1)

          def replace_pyproject(text: str, new: str) -> str:
              pattern = re.compile(r'^version\s*=\s*"[^"]+"\s*$', re.MULTILINE)
              matches = pattern.findall(text)
              if len(matches) != 1:
                  fail(f"pyproject.toml: expected 1 top-level version line, found {len(matches)}")
              return pattern.sub(f'version = "{new}"', text, count=1)

          def replace_plugin_json(text: str, new: str) -> str:
              pattern = re.compile(r'(\n  "version"\s*:\s*)"[^"]+"')
              matches = pattern.findall(text)
              if len(matches) != 1:
                  fail(f"plugin.json: expected 1 top-level version field, found {len(matches)}")
              return pattern.sub(rf'\g<1>"{new}"', text, count=1)

          def project_name_from_pyproject(text: str) -> str:
              m = re.search(r'^name\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
              if not m:
                  fail("could not find [project].name in pyproject.toml")
              return m.group(1)  # type: ignore[union-attr]

          def replace_uv_lock(text: str, project_name: str, new: str) -> str:
              pattern = re.compile(
                  rf'(name\s*=\s*"{re.escape(project_name)}"\s*\nversion\s*=\s*)"[^"]+"'
              )
              matches = pattern.findall(text)
              if len(matches) != 1:
                  fail(
                      f"uv.lock: expected 1 entry for project '{project_name}', "
                      f"found {len(matches)}"
                  )
              return pattern.sub(rf'\g<1>"{new}"', text, count=1)

          def replace_marketplace(text: str, repo_name: str, new: str) -> str:
              pattern = re.compile(r'("version"\s*:\s*)"[^"]+"')
              matches = pattern.findall(text)
              if len(matches) != 2:
                  fail(
                      f"marketplace.json: expected 2 version fields "
                      f"(metadata + 1 plugin entry), found {len(matches)}"
                  )
              if f'"name": "{repo_name}"' not in text:
                  fail(f"marketplace.json: no plugin entry for '{repo_name}'")
              return pattern.sub(rf'\g<1>"{new}"', text)

          def roll_changelog(
              text: str, version: str, today: str, auto_notes: str
          ) -> str:
              header_re = re.compile(r"^## \[Unreleased\][ \t]*$", re.MULTILINE)
              m = header_re.search(text)
              if not m:
                  fail("CHANGELOG.md has no `## [Unreleased]` section")
              start = m.end()  # type: ignore[union-attr]
              next_header = re.search(r"^## \[", text[start:], re.MULTILINE)
              section_end = start + next_header.start() if next_header else len(text)
              manual_body = text[start:section_end].strip()

              # Hand-written notes win when present (operators may curate
              # phrasing for the public release page); otherwise fall back
              # to the auto-generated bullets. If neither produced
              # anything, refuse -- there is genuinely nothing to release.
              if manual_body:
                  release_body = manual_body
              elif auto_notes.strip():
                  release_body = auto_notes.strip()
              else:
                  fail(
                      "no release notes: `[Unreleased]` is empty and no "
                      "non-bot PRs have merged since the last tag"
                  )

              # Replace the [Unreleased] header AND its existing body in
              # one shot so curated content moves into [X.Y.Z] cleanly.
              # Trailing blank line keeps spacing before the next ## [...]
              # section (or before EOF, harmlessly).
              replacement = (
                  f"## [Unreleased]\n\n"
                  f"## [{version}] - {today}\n\n"
                  f"{release_body}\n\n"
              )
              before = text[: m.start()]  # type: ignore[union-attr]
              after = text[section_end:]
              return before + replacement + after

          edits: list[tuple[Path, str, str]] = []

          pyproject = repo / "pyproject.toml"
          project_name: str | None = None
          if pyproject.is_file():
              text = pyproject.read_text(encoding="utf-8")
              project_name = project_name_from_pyproject(text)
              edits.append((pyproject, text, replace_pyproject(text, version)))

          uv_lock = repo / "uv.lock"
          if uv_lock.is_file() and project_name is not None:
              text = uv_lock.read_text(encoding="utf-8")
              edits.append((uv_lock, text, replace_uv_lock(text, project_name, version)))

          plugin_json = repo / ".claude-plugin" / "plugin.json"
          if plugin_json.is_file():
              text = plugin_json.read_text(encoding="utf-8")
              edits.append((plugin_json, text, replace_plugin_json(text, version)))

          marketplace_json = repo / ".claude-plugin" / "marketplace.json"
          if marketplace_json.is_file():
              text = marketplace_json.read_text(encoding="utf-8")
              edits.append(
                  (marketplace_json, text, replace_marketplace(text, repo_name, version))
              )

          auto_notes = build_auto_notes()
          if auto_notes:
              print("Auto-generated release notes from merged PRs:")
              print(auto_notes)
              print()
          else:
              print("No non-bot PRs merged since last tag.")

          changelog = repo / "CHANGELOG.md"
          if not changelog.is_file():
              fail("CHANGELOG.md not found -- every managed repo must have one")
          text = changelog.read_text(encoding="utf-8")
          edits.append(
              (changelog, text, roll_changelog(text, version, today, auto_notes))
          )

          no_ops = [str(p) for p, before, after in edits if before == after]
          if no_ops:
              fail(
                  f"planned edits are no-ops (already at {version}?): {no_ops}"
              )

          combined_diff_lines: list[str] = []
          for path, before, after in edits:
              rel = path.relative_to(repo)
              combined_diff_lines.extend(
                  difflib.unified_diff(
                      before.splitlines(keepends=True),
                      after.splitlines(keepends=True),
                      fromfile=str(rel),
                      tofile=str(rel),
                      n=2,
                  )
              )
              path.write_text(after, encoding="utf-8")

          diff_text = "".join(combined_diff_lines)
          print(diff_text)

          # Persist diff for the PR-body step. Use a heredoc-friendly delimiter
          # since unified diffs contain arbitrary text.
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as fh:
                  fh.write("today=" + today + "\n")
                  fh.write("diff<<__CUT_RELEASE_DIFF_EOF__\n")
                  fh.write(diff_text)
                  if not diff_text.endswith("\n"):
                      fh.write("\n")
                  fh.write("__CUT_RELEASE_DIFF_EOF__\n")
          PY

      - name: Dry-run summary
        if: inputs.dry_run
        shell: bash
        run: |
          echo "--dry-run: edits applied locally on the runner but not pushed."
          echo "See the previous step's log for the unified diff."

      - name: Open release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
          BUMP_DIFF: ${{ steps.bump.outputs.diff }}
          BUMP_TODAY: ${{ steps.bump.outputs.today }}
        shell: bash
        run: |
          set -eu
          branch="release/${INPUT_VERSION}"
          title="Cut ${INPUT_VERSION} release"

          # Bot identity per actions/create-github-app-token README.
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Refuse to clobber an existing release branch -- safer to surface
          # the collision than to silently force-push.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "ERROR: branch $branch already exists on origin"
            exit 1
          fi

          git checkout -b "$branch"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json .claude-plugin/marketplace.json CHANGELOG.md 2>/dev/null || true
          # Some repos don't have uv.lock or one of the plugin files; only
          # commit what actually changed.
          if git diff --cached --quiet; then
            echo "ERROR: nothing staged after edits -- aborting"
            exit 1
          fi
          git commit -m "$title"
          git push -u origin "$branch"

          body_file="$(mktemp)"
          {
            echo "Automated release cut by \`cut-release-reusable.yml\`."
            echo ""
            echo "Target version: \`${INPUT_VERSION}\`"
            echo "Date: \`${BUMP_TODAY}\`"
            echo ""
            echo "## Next steps"
            echo ""
            echo "1. Review the auto-generated CHANGELOG bullets in the diff below. Edit them inline on this PR if any are infra/test-only noise."
            echo "2. Merge this PR."
            echo "3. Locally: \`git tag -s v${INPUT_VERSION} -m \"v${INPUT_VERSION}\" && git push origin v${INPUT_VERSION}\`"
            echo "4. The tag push fires \`release.yml\` (TestPyPI -> PyPI -> GitHub release -> plugins sync dispatch)."
            echo ""
            echo "## Diff"
            echo ""
            echo '```diff'
            printf '%s\n' "$BUMP_DIFF"
            echo '```'
          } > "$body_file"

          gh pr create \
            --repo "TracineHQ/${INPUT_TARGET_REPO}" \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file"
