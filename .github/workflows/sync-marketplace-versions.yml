name: Sync marketplace versions

# Reads each plugin's latest GitHub release tag and opens a PR if the
# version field in .claude-plugin/marketplace.json drifts. Cron-driven
# so a stale display field can never live longer than a day; manual
# workflow_dispatch supported with a ``--dry-run`` flag for ad-hoc checks.

on:
  schedule:
    # 09:17 UTC daily -- offset from the top of the hour to spread Actions
    # load and avoid the :00 cold-pool. Stale display metadata is bounded
    # by 24h; tighter cadence buys little.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report drift without opening a PR'
        required: false
        type: boolean
        default: false
  pull_request:
    # Validate the script + workflow without opening PRs from PRs.
    paths:
      - 'scripts/sync_marketplace_versions.py'
      - '.github/workflows/sync-marketplace-versions.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync marketplace versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Open the eventual drift PR as the dispatcher App, not GITHUB_TOKEN: a
      # GITHUB_TOKEN-authored PR doesn't trigger ci.yml (anti-recursion), so
      # it can't satisfy main's required checks and would sit open. Skipped on
      # pull_request (validation-only, no push) and when App creds are absent
      # (falls back to GITHUB_TOKEN -- PR opens, lands via human review).
      - name: Mint plugins-dispatcher app token
        id: app-token
        if: vars.PLUGINS_DISPATCH_CLIENT_ID != '' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.PLUGINS_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.PLUGINS_DISPATCH_APP_PRIVATE_KEY }}
          owner: TracineHQ
          repositories: plugins
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Run sync script
        id: sync
        env:
          # Drop into the GitHub API to fetch each plugin's latest release.
          # GITHUB_TOKEN here is the workflow's ephemeral token; it has read
          # access to public repos which is all the script needs (read /
          # releases / latest).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Dry-run on PRs (no write) and when the dispatch input asks for it;
          # full sync on cron + bare workflow_dispatch.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/sync_marketplace_versions.py --dry-run || rc=$?
          else
            python3 scripts/sync_marketplace_versions.py || rc=$?
          fi
          rc=${rc:-0}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # rc 0 = no drift, 1 = drift (would write / wrote), 2 = error
          if [ "$rc" = "2" ]; then
            exit 2
          fi

      # Bot-opened PRs don't trigger workflow_run (GitHub guard against
      # recursion), so the marketplace validator never sees the bot's diff.
      # Run the same validator inline before pushing -- a malformed manifest
      # fails the workflow loudly instead of landing on a quiet PR.
      - name: Validate marketplace manifest
        if: steps.sync.outputs.rc == '1' && inputs.dry_run != 'true' && github.event_name != 'pull_request'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
      - name: Install Claude Code and validate
        if: steps.sync.outputs.rc == '1' && inputs.dry_run != 'true' && github.event_name != 'pull_request'
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./.claude-plugin/marketplace.json

      - name: Open PR with version bumps
        if: |
          steps.sync.outputs.rc == '1'
          && inputs.dry_run != 'true'
          && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          title="chore: sync marketplace.json versions to latest releases"

          # Skip if an open sync PR already exists -- humans can merge that
          # one and the next cron will reconcile any remaining drift.
          existing=$(gh pr list --state open --search "in:title \"$title\"" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "Open sync PR #$existing already exists; skipping."
            exit 0
          fi

          # Run-ID suffix avoids same-day branch collisions across cron +
          # manual dispatch overlap.
          branch="bot/sync-marketplace-versions-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          # Commit as the App when its token was minted (a non-GITHUB_TOKEN
          # author is what makes ci.yml run on the PR); fall back to
          # github-actions[bot] otherwise. checkout persisted the same token,
          # so the push below authenticates without `gh auth setup-git`.
          if [ -n "${APP_SLUG:-}" ]; then
            app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          git checkout -b "$branch"
          git add .claude-plugin/marketplace.json
          git commit -m "$title"
          git push -u origin "$branch"
          pr_url=$(gh pr create \
            --title "$title" \
            --body "Daily auto-sync from the source repos' latest GitHub release tags. See workflow run logs for the specific bumps.")

          echo "Opened $pr_url"
          # Land automatically once main's required checks pass. Non-fatal if
          # auto-merge can't be enabled (App creds absent -> GITHUB_TOKEN PR ->
          # no CI reports) -- a human can still merge.
          gh pr merge "$pr_url" --auto --squash || \
            echo "WARN: could not enable auto-merge on $pr_url (continuing)"
